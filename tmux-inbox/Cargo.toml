[package]
name = "tmux-inbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tmux-inbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"

[dev-dependencies]
tempfile = "3"
