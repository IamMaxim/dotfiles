# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Minimal centered tab list
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=default,fg=colour244'
set -g status-left-length 44
set -g status-right-length 48
set -g status-left ''
set -g status-right "#[fg=colour244,bg=default]#($HOME/.tmux/battery-status.sh)  #($HOME/.tmux/adapter-wattage.sh)  %H:%M"
set -g status-interval 5

set -g window-status-separator '  '
set -g window-status-format '#[fg=colour244,bg=default]#W'
set -g window-status-current-format '#[fg=colour231,bg=default,bold]#W'
set -g window-status-activity-style 'fg=colour250,bg=default'
set -g window-status-bell-style 'fg=colour223,bg=default,bold'
set -g window-status-last-style 'fg=colour250,bg=default'

# Option + arrows to change windows
bind-key -n M-Left select-window -t -1
bind-key -n M-Right select-window -t +1

# Ctrl + Option + arrows to move the current window
bind-key -n C-M-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-M-Right swap-window -t +1 \; select-window -t +1

# Prefix + | to split vertically, same as Prefix + %
bind-key | split-window -h

# Enable mouse support
set -g mouse on
# Scroll one line instead of 5 on mouse wheel events
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
# Enable extended keys support (shift+enter and other stuff for TUIs)
set -g extended-keys on
%if "#{>=:#{version},3.5}"
set -g extended-keys-format csi-u
%endif

# Named panes: per-pane top border, color-coded by command via ~/.tmux/pane-label.sh
# (active pane = its command's color + bold; inactive panes recede to dim gray)
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format '#($HOME/.tmux/pane-label.sh label "#{pane_current_command}" "#{pane_active}" "#{pane_current_path}" "#{window_zoomed_flag}" "#{pane_title}" "#{host}")'
set -g pane-border-style 'fg=#5B595C'
set -g pane-active-border-style 'fg=#($HOME/.tmux/pane-label.sh color "#{pane_current_command}")'
# Keep manual titles from being overwritten by the shell/programs
set -g allow-rename off
set -g automatic-rename off
# Prefix + T to (re)name the current pane
bind-key T command-prompt -p 'pane title:' "select-pane -T '%%'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
