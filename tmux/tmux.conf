# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Minimal centered tab list
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=default,fg=colour244'
set -g status-left-length 0
set -g status-right-length 32
set -g status-left ''
set -g status-right "#[fg=colour244,bg=default]#($HOME/.tmux/battery-status.sh)  %H:%M"
set -g status-interval 5

set -g window-status-separator '  '
set -g window-status-format '#[fg=colour244,bg=default]#W'
set -g window-status-current-format '#[fg=colour231,bg=default,bold]#W'
set -g window-status-activity-style 'fg=colour250,bg=default'
set -g window-status-bell-style 'fg=colour223,bg=default,bold'
set -g window-status-last-style 'fg=colour250,bg=default'

# Option + arrows to change windows
bind-key -n M-Left select-window -t -1
bind-key -n M-Right select-window -t +1

# Ctrl + Option + arrows to move the current window
bind-key -n C-M-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-M-Right swap-window -t +1 \; select-window -t +1

# Prefix + | to split vertically, same as Prefix + %
bind-key | split-window -h

# Enable mouse support
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
